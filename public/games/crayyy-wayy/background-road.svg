<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0630"/>
      <stop offset="45%" stop-color="#3a0f4a"/>
      <stop offset="75%" stop-color="#7a1f3d"/>
      <stop offset="100%" stop-color="#c9631f"/>
    </linearGradient>
    <linearGradient id="glow-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5e3a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241428"/>
      <stop offset="100%" stop-color="#0d0812"/>
    </linearGradient>
    <linearGradient id="wet-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ff2f92" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- glow sun/horizon -->
  <ellipse cx="400" cy="150" rx="260" ry="90" fill="url(#sun-glow)" opacity="0.6"/>

  <!-- Lightning bolts -->
  <g stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M110 10 L85 70 L105 70 L70 150" stroke="#c86bff" stroke-width="4" fill="none" filter="url(#soft-blur)"/>
    <path d="M110 10 L85 70 L105 70 L70 150" stroke="#e6b3ff" stroke-width="2" fill="none"/>
    <path d="M690 5 L715 60 L695 62 L730 140" stroke="#5ec8ff" stroke-width="4" fill="none" filter="url(#soft-blur)"/>
    <path d="M690 5 L715 60 L695 62 L730 140" stroke="#bfe9ff" stroke-width="2" fill="none"/>
  </g>

  <!-- Bridge arch (Third Mainland vibe) -->
  <g opacity="0.55" fill="none" stroke="#ffcf7a" stroke-width="3">
    <path d="M260 130 Q400 40 540 130"/>
    <line x1="300" y1="130" x2="300" y2="100"/>
    <line x1="340" y1="130" x2="340" y2="78"/>
    <line x1="380" y1="130" x2="380" y2="60"/>
    <line x1="420" y1="130" x2="420" y2="60"/>
    <line x1="460" y1="130" x2="460" y2="78"/>
    <line x1="500" y1="130" x2="500" y2="100"/>
  </g>
  <line x1="60" y1="132" x2="740" y2="132" stroke="#ffcf7a" stroke-width="2" opacity="0.5"/>

  <!-- City skyline silhouette -->
  <g fill="#160a24" opacity="0.9">
    <rect x="10" y="90" width="26" height="60"/>
    <rect x="42" y="70" width="18" height="80"/>
    <rect x="66" y="100" width="22" height="50"/>
    <rect x="600" y="95" width="20" height="55"/>
    <rect x="626" y="75" width="16" height="75"/>
    <rect x="648" y="105" width="24" height="45"/>
    <rect x="680" y="85" width="18" height="65"/>
    <rect x="704" y="100" width="26" height="50"/>
    <rect x="736" y="80" width="18" height="70"/>
    <rect x="760" y="98" width="24" height="52"/>
  </g>
  <!-- window lights -->
  <g fill="#ffd27a" opacity="0.8">
    <rect x="16" y="98" width="3" height="3"/><rect x="24" y="106" width="3" height="3"/>
    <rect x="47" y="80" width="3" height="3"/><rect x="47" y="96" width="3" height="3"/>
    <rect x="606" y="104" width="3" height="3"/><rect x="654" y="112" width="3" height="3"/>
    <rect x="710" y="108" width="3" height="3"/><rect x="742" y="90" width="3" height="3"/>
  </g>

  <!-- Palm trees -->
  <g fill="#0f0616">
    <path d="M262 150 L266 92" stroke="#0f0616" stroke-width="5" fill="none"/>
    <path d="M266 96 Q240 78 220 88 M266 96 Q292 76 312 84 M266 96 Q252 66 238 52 M266 96 Q280 66 296 54 M266 96 Q266 62 266 46" stroke="#1c0f2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M538 150 L534 92" stroke="#0f0616" stroke-width="5" fill="none"/>
    <path d="M534 96 Q508 78 488 88 M534 96 Q560 76 580 84 M534 96 Q520 66 506 52 M534 96 Q548 66 564 54 M534 96 Q534 62 534 46" stroke="#1c0f2a" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Distant traffic glow strip -->
  <rect x="0" y="150" width="800" height="10" fill="url(#glow-orange)" opacity="0.5"/>

  <!-- Road -->
  <rect y="150" width="800" height="250" fill="url(#road-grad)"/>
  <rect y="150" width="800" height="250" fill="url(#wet-sheen)"/>

  <!-- roadside curb strip -->
  <rect y="150" width="800" height="6" fill="#3a2a44"/>

  <!-- Market stall silhouettes with warm bulb lights, roadside -->

  <g fill="#ffd27a" opacity="0.9">
    <circle cx="30" cy="158" r="2"/><circle cx="55" cy="156" r="2"/><circle cx="80" cy="158" r="2"/>
    <circle cx="710" cy="158" r="2"/><circle cx="740" cy="156" r="2"/><circle cx="770" cy="158" r="2"/>
  </g>

  <!-- Lane dividers (3 lanes) with subtle neon tint -->
  <g stroke="#F5C4B3" stroke-width="4" stroke-dasharray="30 24" opacity="0.9">
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="290" x2="800" y2="290"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>
  <g stroke="#ff5ec4" stroke-width="1" stroke-dasharray="30 24" opacity="0.35">
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="290" x2="800" y2="290"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- lane edge glows for wet asphalt reflections -->
  <g opacity="0.25">
    <ellipse cx="150" cy="255" rx="60" ry="6" fill="#ff9a3d"/>
    <ellipse cx="420" cy="255" rx="70" ry="6" fill="#c86bff"/>
    <ellipse cx="650" cy="255" rx="55" ry="6" fill="#ff9a3d"/>
    <ellipse cx="250" cy="325" rx="60" ry="6" fill="#5ec8ff"/>
    <ellipse cx="550" cy="325" rx="65" ry="6" fill="#ff5ec4"/>
  </g>

  <!-- Bottom / top track borders -->
  <g fill="#0a0610">
    <rect x="0" y="150" width="800" height="6"/>
    <rect x="0" y="394" width="800" height="6"/>
  </g>
</svg>