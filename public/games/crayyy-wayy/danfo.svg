<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700">
    <defs>
        <!-- Body Shape Clip Path -->
        <clipPath id="body-clip">
            <path id="body-shape" d="
                M 190 140
                L 1170 140
                C 1190 140, 1200 145, 1210 160
                L 1255 280
                C 1260 295, 1265 310, 1265 330
                L 1270 500
                C 1270 515, 1255 520, 1240 520
                L 190 520
                C 170 520, 160 510, 160 490
                L 160 170
                C 160 150, 175 140, 190 140 Z" />
        </clipPath>

        <!-- Windows Clip Path for Reflections -->
        <clipPath id="windows-clip">
            <rect x="200" y="170" width="230" height="130" rx="12" />
            <rect x="460" y="170" width="250" height="130" rx="12" />
            <rect x="740" y="170" width="200" height="130" rx="12" />
            <path d="
                M 970 170
                H 1180
                C 1195 170, 1205 175, 1215 195
                L 1255 280
                C 1260 290, 1260 310, 1250 310
                H 970
                C 960 310, 955 305, 955 295
                V 185
                C 955 175, 960 170, 970 170 Z" />
        </clipPath>
    </defs>

    <!-- Main Bus Body -->
    <g id="body">
        <use href="#body-shape" fill="#FFCC00" />
        
        <!-- Top Edge Highlight -->
        <path d="M 195 148 L 1170 148 C 1185 148, 1195 152, 1205 165" stroke="#FFE55C" stroke-width="8" stroke-linecap="round" fill="none" />
        
        <!-- Bottom Edge Shadow -->
        <rect x="150" y="495" width="1150" height="25" fill="#E6B800" clip-path="url(#body-clip)" />

        <!-- Classic Danfo Black Stripes -->
        <g clip-path="url(#body-clip)">
            <rect x="150" y="340" width="1150" height="16" fill="#111111" />
            <rect x="150" y="370" width="1150" height="16" fill="#111111" />
        </g>
    </g>

    <!-- Wheel Arches (Cutouts) -->
    <g id="wheel-arches">
        <!-- Rear Arch -->
        <path d="M 215 520 A 115 115 0 0 1 445 520 Z" fill="#222222" />
        <path d="M 230 520 A 100 100 0 0 1 430 520 Z" fill="#0A0A0A" />
        <!-- Front Arch -->
        <path d="M 945 520 A 115 115 0 0 1 1175 520 Z" fill="#222222" />
        <path d="M 960 520 A 100 100 0 0 1 1160 520 Z" fill="#0A0A0A" />
    </g>

    <!-- Doors & Seams -->
    <g id="doors">
        <!-- Sliding Passenger Door Seam -->
        <rect x="445" y="145" width="280" height="370" rx="15" fill="none" stroke="#D4A700" stroke-width="4" />
        <!-- Driver Door Seams -->
        <path d="M 955 145 V 515" stroke="#D4A700" stroke-width="4" fill="none" />
        <path d="M 1255 330 C 1245 350, 1245 450, 1255 515" stroke="#D4A700" stroke-width="4" fill="none" />
    </g>

    <!-- Detailed Body Elements -->
    <g id="details">
        <!-- Sliding Door Rail -->
        <rect x="250" y="355" width="490" height="8" rx="4" fill="#222222" />
        
        <!-- Door Handles -->
        <rect x="460" y="325" width="35" height="12" rx="4" fill="#111111" /> <!-- Sliding Door -->
        <rect x="970" y="325" width="35" height="12" rx="4" fill="#111111" /> <!-- Driver Door -->
        
        <!-- Rear Engine Vents (Classic VW T3) -->
        <g fill="#111111">
            <rect x="210" y="410" width="8" height="60" rx="3" />
            <rect x="225" y="410" width="8" height="60" rx="3" />
            <rect x="240" y="410" width="8" height="60" rx="3" />
            <rect x="255" y="410" width="8" height="60" rx="3" />
            <rect x="270" y="410" width="8" height="60" rx="3" />
        </g>

        <!-- Fuel Cap -->
        <circle cx="890" cy="450" r="14" fill="#111111" />
        <circle cx="890" cy="450" r="10" fill="#333333" />
    </g>

    <!-- Windows -->
    <g id="windows">
        <!-- Base Dark Tinted Glass -->
        <rect x="200" y="170" width="230" height="130" rx="12" fill="#1C2833" />
        <rect x="460" y="170" width="250" height="130" rx="12" fill="#1C2833" />
        <rect x="740" y="170" width="200" height="130" rx="12" fill="#1C2833" />
        <path d="
            M 970 170
            H 1180
            C 1195 170, 1205 175, 1215 195
            L 1255 280
            C 1260 290, 1260 310, 1250 310
            H 970
            C 960 310, 955 305, 955 295
            V 185
            C 955 175, 960 170, 970 170 Z" fill="#1C2833" />
        
        <!-- Premium Glass Reflections (Clipped perfectly to window shapes) -->
        <g clip-path="url(#windows-clip)">
            <!-- Primary Broad Highlights -->
            <polygon points="250,170 300,170 240,300 190,300" fill="#2E4053" />
            <polygon points="510,170 560,170 500,300 450,300" fill="#2E4053" />
            <polygon points="790,170 840,170 780,300 730,300" fill="#2E4053" />
            <polygon points="1030,170 1080,170 1020,300 970,300" fill="#2E4053" />
            
            <!-- Secondary Sharp Highlights -->
            <polygon points="315,170 330,170 270,300 255,300" fill="#34495E" />
            <polygon points="575,170 590,170 530,300 515,300" fill="#34495E" />
            <polygon points="855,170 870,170 810,300 795,300" fill="#34495E" />
            <polygon points="1095,170 1110,170 1050,300 1035,300" fill="#34495E" />
        </g>
    </g>

    <!-- Wheels -->
    <g id="wheels">
        <!-- Rear Wheel -->
        <g id="rear-wheel">
            <!-- Tire -->
            <circle cx="330" cy="520" r="85" fill="#1A1A1A" />
            <path d="M 250 520 A 80 80 0 0 1 410 520" stroke="#2C2C2C" stroke-width="6" fill="none" />
            <!-- Rim Base -->
            <circle cx="330" cy="520" r="50" fill="#DDDDDD" />
            <circle cx="330" cy="520" r="38" fill="#999999" />
            <!-- Steel Rim Holes -->
            <circle cx="352" cy="520" r="7" fill="#222222" />
            <circle cx="341" cy="539" r="7" fill="#222222" />
            <circle cx="319" cy="539" r="7" fill="#222222" />
            <circle cx="308" cy="520" r="7" fill="#222222" />
            <circle cx="319" cy="501" r="7" fill="#222222" />
            <circle cx="341" cy="501" r="7" fill="#222222" />
            <!-- Center Hubcap -->
            <circle cx="330" cy="520" r="14" fill="#111111" />
            <circle cx="330" cy="520" r="10" fill="#444444" />
        </g>

        <!-- Front Wheel -->
        <g id="front-wheel">
            <!-- Tire -->
            <circle cx="1060" cy="520" r="85" fill="#1A1A1A" />
            <path d="M 980 520 A 80 80 0 0 1 1140 520" stroke="#2C2C2C" stroke-width="6" fill="none" />
            <!-- Rim Base -->
            <circle cx="1060" cy="520" r="50" fill="#DDDDDD" />
            <circle cx="1060" cy="520" r="38" fill="#999999" />
            <!-- Steel Rim Holes -->
            <circle cx="1082" cy="520" r="7" fill="#222222" />
            <circle cx="1071" cy="539" r="7" fill="#222222" />
            <circle cx="1049" cy="539" r="7" fill="#222222" />
            <circle cx="1038" cy="520" r="7" fill="#222222" />
            <circle cx="1049" cy="501" r="7" fill="#222222" />
            <circle cx="1071" cy="501" r="7" fill="#222222" />
            <!-- Center Hubcap -->
            <circle cx="1060" cy="520" r="14" fill="#111111" />
            <circle cx="1060" cy="520" r="10" fill="#444444" />
        </g>
    </g>

    <!-- Bumpers -->
    <g id="bumpers">
        <!-- Rear Bumper -->
        <path d="M 165 470 L 130 470 C 120 470, 120 515, 130 515 L 175 515 Z" fill="#1A1A1A" />
        <rect x="130" y="470" width="40" height="6" fill="#333333" rx="2" />
        <!-- Front Bumper -->
        <path d="M 1260 470 L 1300 470 C 1310 470, 1310 515, 1300 515 L 1240 515 Z" fill="#1A1A1A" />
        <rect x="1260" y="470" width="40" height="6" fill="#333333" rx="2" />
    </g>

    <!-- Lights and Indicators -->
    <g id="lights">
        <!-- Front Headlight Group -->
        <rect x="1255" y="340" width="16" height="38" rx="4" fill="#FDFEFE" />
        <rect x="1255" y="384" width="16" height="16" rx="3" fill="#FF8C00" />
        <!-- Rear Taillights -->
        <rect x="156" y="315" width="8" height="50" rx="3" fill="#E74C3C" />
        <rect x="156" y="372" width="8" height="20" rx="3" fill="#F39C12" />
        <rect x="156" y="398" width="8" height="15" rx="3" fill="#ECF0F1" />
    </g>

    <!-- Mirrors -->
    <g id="mirrors">
        <!-- Extended Arm -->
        <path d="M 1225 280 L 1290 280 L 1285 290 L 1225 290 Z" fill="#222222" />
        <!-- Mirror Housing -->
        <rect x="1280" y="240" width="18" height="65" rx="6" fill="#111111" />
        <!-- Glass Surface -->
        <rect x="1283" y="245" width="8" height="55" rx="3" fill="#BDC3C7" />
    </g>
</svg>
